[package]
name = "twingate-tray"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "Twingate icon in the system tray, in the style of the Windows client"
publish = false

[dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
regex = "1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
